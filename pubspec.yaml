name: tiger_tap_quest
description: app.
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.4.0
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/app_icons/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icons/android/mipmap-xxxhdpi/ic_launcher.png
  min_sdk_android: 21
  remove_alpha_ios: true
