name: tiger_tap_quest
description: A jungle-themed fruit tapping arcade game with multiple modes, achievements and upgrades.
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.4.0
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  appsflyer_sdk: ^6.15.4
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/app_icons/
    - assets/sounds/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icons/android/mipmap-xxxhdpi/ic_launcher.png
  min_sdk_android: 21
  remove_alpha_ios: true
